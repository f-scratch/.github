name: Cycle PR

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 処理するブランチ（省略時は実行対象ブランチ）
        required: false
        type: string
  push:
    branches:
      - main
      - develop
      - develop_sprint*
      - integration/sprint*
      - release-*

jobs:
  cycle-pr:
    permissions:
      contents: read
      pull-requests: write
    uses: f-scratch/.github/.github/workflows/cycle-pr.yml@master
    with:
      source_branch: ${{ inputs.source_branch || github.ref_name }}
