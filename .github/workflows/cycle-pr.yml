name: Cycle PR

on:
  workflow_call:
jobs:
  cycle-pr:
    runs-on: ubuntu-latest
    concurrency:
      group: cycle-pr-${{ github.repository }}-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Create missing cycle PRs
        uses: f-scratch/.github/actions/cycle-pr@master
        with:
          token: ${{ github.token }}
          source-branch: ${{ github.ref_name }}
