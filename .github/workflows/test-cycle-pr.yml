name: Test Cycle PR

on:
  pull_request:
    paths:
      - .github/workflows/cycle-pr.yml
      - .github/workflows/test-cycle-pr.yml
      - actions/cycle-pr/**
  push:
    branches:
      - master
    paths:
      - .github/workflows/cycle-pr.yml
      - .github/workflows/test-cycle-pr.yml
      - actions/cycle-pr/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install dependencies
        working-directory: actions/cycle-pr
        run: npm ci
      - name: Run unit tests
        working-directory: actions/cycle-pr
        run: npm test
      - name: Verify packaged action
        working-directory: actions/cycle-pr
        run: |
          npm run build
          git diff --exit-code -- dist
